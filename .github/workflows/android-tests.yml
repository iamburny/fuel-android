name: Android Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # app/build.gradle.kts applies com.google.gms.google-services, which hard-fails the build
      # when app/google-services.json is missing — and that file is gitignored (real Firebase
      # config, never committed). Unit tests never touch real Firebase; this stub just satisfies
      # the plugin's file-presence check and BuildConfig generation.
      - name: Write stub google-services.json
        run: |
          cat > app/google-services.json <<'EOF'
          { "project_info": { "project_id": "ci-stub", "project_number": "000000000000" },
            "client": [{ "client_info": { "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
              "android_client_info": { "package_name": "uk.fueltracker.app" } },
              "api_key": [{ "current_key": "ci-stub" }] }] }
          EOF

      # One invocation covering both the test run and the coverage report so there's a single
      # Gradle configuration phase, not two. Uses the debug-variant-qualified Kover tasks
      # (koverXmlReportDebug/koverHtmlReportDebug) rather than the plain koverXmlReport/
      # koverHtmlReport — those unqualified tasks aggregate every build variant, which would
      # force a release compile that no test here ever exercises.
      - name: Run unit tests and generate coverage
        run: ./gradlew :core:testDebugUnitTest :app:testDebugUnitTest :core:koverXmlReportDebug :core:koverHtmlReportDebug :app:koverXmlReportDebug :app:koverHtmlReportDebug

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: '**/build/reports/kover/'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: '**/build/test-results/testDebugUnitTest/'
