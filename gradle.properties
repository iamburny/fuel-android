android.useAndroidX=true
android.nonTransitiveRClass=true
# Hilt/KSP annotation processing over :app + :core loads enough classes to exhaust a 512m
# metaspace, which fails the release build at :app:hiltJavaCompileRelease.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=1g
org.gradle.vfs.watch=false

# AGP 9's default "built-in Kotlin" support drops compatibility with the org.jetbrains.kotlin.android
# plugin (and its Compose-compiler/KSP/Hilt companions) as applied throughout this project, and
# forces Kotlin Gradle Plugin 2.2.10+. Opting out keeps the existing, verified Kotlin/Compose/Hilt/
# KSP toolchain working unchanged on the new AGP version. Both flags are removed in AGP 10.0
# (mid-2026), at which point this project will need the full built-in-Kotlin migration.
android.newDsl=false
android.builtInKotlin=false
